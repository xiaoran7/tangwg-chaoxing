# ===== HTTPS 证书（已备案域名）=====
# nginx 监听 443 终止 TLS，uvicorn 只听 127.0.0.1:8000 —— 证书不进应用层。
#
# 反代只做三件事：TLS 终止、透传、不跳转。
# 千万别配 301/302（脚本的 GM_xmlhttpRequest 会跟随重定向，最终 URL 还要在 @connect 白名单里）。

server {
    listen 80;
    server_name tiku.example.com;          # <- 改成你的备案域名
    # ACME 校验用；签发后可以改成 301，但见上方「别跳转」说明，
    # 建议保留 200 兜底，或签发后在客户端 @connect 里同时写上两个域名。
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 200 "ok"; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tiku.example.com;

    ssl_certificate     /etc/letsencrypt/live/tiku.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiku.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 客户端代理超时普通 240s / 听力 360s，nginx 放宽至 420s 以免反代先断
    proxy_read_timeout  420s;
    proxy_send_timeout  420s;
    proxy_connect_timeout 10s;
    proxy_buffering     off;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ===== 证书签发 =====
# certbot certonly --webroot -w /var/www/html -d tiku.example.com
# systemd 续期定时器一般已自带：sudo systemctl status certbot.timer
